server {
  # nginx-unprivileged listens high; Traefik forwards to this port.
  listen 8080;
  server_name game.sdujack2012.win;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # NOTE: do NOT declare a `types { }` block here. It does not extend the table
  # inherited from /etc/nginx/mime.types, it REPLACES it - which silently served
  # index.html, src/*.js and styles.css as application/octet-stream, and a browser
  # refuses an ES module with the wrong MIME type. The stock table already covers
  # html, css, js, webp and mp3, which is everything the page asks for.

  # Art and music must be REVALIDATED, not cached blind.
  #
  # This used to be `max-age=2592000, immutable`, on the reasoning that art only
  # changes when it is regenerated. That reasoning had a hole the size of a style
  # pass: the files keep their names, so replacing a sprite left every returning
  # player looking at the old one - and `immutable` told the browser not to
  # revalidate even on a normal reload. Re-skinning the game silently did not
  # reach anyone who had visited before.
  #
  # `no-cache` does not mean "do not store"; it means "store, but check with me
  # before using it". The ETag makes that a 304 with no body, so the cost is one
  # conditional request per asset per load and correctness is automatic: the next
  # art change is visible on the next page load.
  location ~* \.(webp|png|mp3|flac|woff2)$ {
    add_header Cache-Control "no-cache, must-revalidate";
    etag on;
    try_files $uri =404;
  }

  # Code and markup stay revalidated, so a deploy is visible on the next load
  # instead of thirty days later.
  location ~* \.(js|mjs|css|html)$ {
    add_header Cache-Control "public, max-age=300, must-revalidate";
    try_files $uri =404;
  }

  # The repo is bind-mounted straight in, so the site root genuinely contains
  # .git. Serve it and the whole history is public.
  location ~ /\. {
    deny all;
  }

  # The game is a canvas + ES modules; the only thing worth compressing hard is
  # its source and markup.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  # Kept from the dev server: the renderer is written to survive without it, but
  # the header is what high-resolution timers want.
  add_header Cross-Origin-Opener-Policy same-origin always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
