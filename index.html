<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RUNE PRESSURE</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07070d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Draw runes. Survive the wave. An action + puzzle glyph-casting arena game." />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="stage" aria-label="RUNE PRESSURE play field"></canvas>

    <!-- Boot diagnostics: replaced by the game once modules load. -->
    <noscript id="boot-msg">RUNE PRESSURE needs JavaScript enabled.</noscript>
    <div id="boot" role="status">summoning the circle&hellip;</div>

    <script type="module">
      import { boot } from './src/main.js';
      const bootEl = document.getElementById('boot');
      try {
        await boot(document.getElementById('stage'));
        bootEl.remove();
      } catch (err) {
        bootEl.textContent = 'failed to start: ' + (err?.message ?? err);
        bootEl.dataset.error = 'true';
        throw err;
      }
    </script>
  </body>
</html>
